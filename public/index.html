<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2e9">
    <meta name="description" content="Photobooth and videography for your event. Tell us what you’re planning at info@knockbox.nz.">
    <title>Knockbox Studios — Photobooth &amp; videography</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Asap:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div class="wordmark" aria-label="Knockbox Studios">
          <span class="brand-mark" aria-hidden="true"><img src="/assets/knockbox-bar-and-bowl.png" alt="" width="1254" height="1254"></span>
          <span>knockbox<span class="wordmark-sub">studios</span></span>
        </div>
      </header>

      <main>
        <section class="contact" aria-labelledby="contact-title">
          <div>
            <p class="label eyebrow">Planning an event?</p>
            <h1 id="contact-title">Tell us what’s happening.</h1>
            <p class="contact-copy">Send us the date, the place and what you have in mind.</p>
          </div>
          <div class="contact-action">
            <a class="contact-link" href="mailto:info@knockbox.nz">Contact us <span aria-hidden="true">→</span></a>
            <p class="email">info@knockbox.nz</p>
          </div>
        </section>
      </main>

      <footer>
        <span class="label">Knockbox Studios</span>
        <span class="footer-note">Simple. Useful.</span>
      </footer>
    </div>
  </body>
</html>
